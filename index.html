  button.alt{background:var(--red);border-color:#5e1128;box-shadow:0 4px 0 #5e1128}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  .door small{display:block;color:#d9c3a0;margin-top:8px;font-size:.8em}
  .lamp{width:clamp(44px,11vw,80px);height:clamp(44px,11vw,80px);opacity:.35;border:4px solid #000;padding:0}

<script>
/* ============================================================
   KAAVU: HALLOWEEN NIGHT
   L1: Madampalli Mana (Sunny & Nagavalli)
   L2: Koduman Mana (Thevan & Koduman Potti)
   L3: Abandoned House (Arun & Christopher)
   ============================================================ */
const W = 320, H = 180;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const panel = document.getElementById('panel'), helpBtn = document.getElementById('help'), soundBtn = document.getElementById('soundBtn');

/* ---------- AUDIO ENGINE ---------- */
let audioEnabled = true;
const AUDIOS = {
  sunny: new Audio('assets/sunny_shout.mp3'),
  kodu:  new Audio('assets/kodu.mp3'),
  gun:   new Audio('assets/gun.mp3')
};
for(const k in AUDIOS) {
  AUDIOS[k].preload = 'auto';
}

// Horror Synthesizer (Web Audio API)
let audioCtx = null;
let musicInterval = null;
let droneOsc1 = null, droneOsc2 = null, droneGain = null;

function initAudio(){
  if(audioCtx) return;
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    startHorrorMusic();
  } catch(e){
    console.log("AudioContext not supported", e);
  }
}

function startHorrorMusic(){
  if(!audioCtx || !audioEnabled) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(droneOsc1) return;

  const masterMusicGain = audioCtx.createGain();
  masterMusicGain.gain.setValueAtTime(0.22, audioCtx.currentTime);
  masterMusicGain.connect(audioCtx.destination);
  droneGain = masterMusicGain;

  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(140, audioCtx.currentTime);
  filter.connect(masterMusicGain);

  droneOsc1 = audioCtx.createOscillator();
  droneOsc1.type = "sawtooth";
  droneOsc1.frequency.setValueAtTime(55, audioCtx.currentTime);
  droneOsc1.connect(filter);
  droneOsc1.start();

  droneOsc2 = audioCtx.createOscillator();
  droneOsc2.type = "triangle";
  droneOsc2.frequency.setValueAtTime(57.5, audioCtx.currentTime);
  droneOsc2.connect(filter);
  droneOsc2.start();

  const horrorNotes = [523.25, 554.37, 659.25, 698.46, 783.99, 830.61, 987.77, 1046.50];
  let noteStep = 0;
  musicInterval = setInterval(()=>{
    if(!audioEnabled || !audioCtx || G.state === "over") return;
    const isFight = (G.state === "fight");
    
    if(Math.random() > (isFight ? 0.15 : 0.35)){
      const freq = horrorNotes[noteStep % horrorNotes.length];
      playHorrorBell(freq, isFight ? 0.14 : 0.08);
      noteStep = (noteStep + (Math.random() > 0.4 ? 1 : 2)) % horrorNotes.length;
    }
    playHeartbeat(isFight);
  }, 450);
}

function playHorrorBell(freq, vol){
  if(!audioCtx || !audioEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1.25);
}

function playHeartbeat(isFight){
  if(!audioCtx || !audioEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(isFight ? 75 : 55, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.18);
  const vol = isFight ? 0.35 : 0.16;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

function playDefeatAudio(lvl){
  if(!audioEnabled) return;
  try {
    let aud = null;
    if(lvl === 0) aud = AUDIOS.sunny;
    else if(lvl === 1) aud = AUDIOS.kodu;
    else if(lvl === 2) aud = AUDIOS.gun;
    if(aud){
      aud.currentTime = 0;
      aud.play().catch(e => console.log("Audio play failed:", e));
    }
  } catch(e){}
}

soundBtn.onclick = ()=>{
  audioEnabled = !audioEnabled;
  soundBtn.textContent = audioEnabled ? "🔊 AUDIO: ON" : "🔇 AUDIO: MUTED";
  if(!audioEnabled){
    if(droneGain && audioCtx) droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
  } else {
    initAudio();
    if(droneGain && audioCtx) droneGain.gain.setValueAtTime(0.22, audioCtx.currentTime);
  }
};

const ALL_PUZZLE_TYPES = ["math", "memory", "riddle"];

const TRIVIA = [

];
const BOSS_TIME = 29;

/* ---------- STATE ---------- */
const G = {
  state: "title",
  lvl: 0,
  lives: 3,
  keys: 0,
  px: 20,
  door: 0,
  doorPuzzles: ["math", "memory", "riddle"],
  currentPuzzle: "math",
  timer: BOSS_TIME,
  phase: "wait",
  heroX: -30,
  zapT: 0,
  t: 0
};
const keys = {};
let lastTs = 0;

/* ---------- HELPERS ---------- */
const R = (x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle = a=>{const copy=[...a];for(let i=copy.length-1;i>0;i--){const j=rnd(0,i);[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
function txt(s,x,y,size,col,align){ctx.font=size+"px 'Press Start 2P',monospace";ctx.textAlign=align||"left";ctx.fillStyle="#000";ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||"#fff";ctx.fillText(s,x,y)}
function showPanel(html){panel.innerHTML=html;panel.style.display="flex"}
function closePanel(){panel.style.display="none";panel.innerHTML=""}
const panelOpen = ()=>panel.style.display==="flex";
const theme = ()=>LEVELS[G.lvl];

/* ---------- DRAWING: SCENERY ---------- */
function drawTree(x,col){
  R(x,60,16,90,col); R(x+3,60,4,90,"#00000030");
  R(x-14,66,16,5,col); R(x-14,52,5,18,col); R(x+14,50,18,5,col); R(x+28,36,5,18,col);
  R(x-4,40,5,24,col); R(x+8,34,5,28,col);
}
function drawBackground(t){
  const th = theme();
  R(0,0,W,H,th.sky);
  R(0,70,W,60,"#00000022");
  for(let i=0;i<9;i++){const x=i*38-6; R(x,70,8,80,"#0e2a30"); R(x-6,82,20,4,"#0e2a30"); R(x+2,60,4,16,"#0e2a30")}
  for(let i=0;i<16;i++){const x=(i*29+t*8)%W, y=24+Math.sin(t*1.3+i)*8+i%4*7; R(x,y,3,3,"#6fb04a")}
  drawTree(14,th.tree); drawTree(84,th.tree);
  R(0,148,W,32,"#4a5a50");
  for(let i=0;i<W;i+=22){R(i,148,2,32,"#2c3a32");R(i+9,164,2,16,"#2c3a32")}
  R(0,148,W,2,"#6a8a58"); R(0,163,W,1,"#2c3a32");
  for(let i=0;i<14;i++)R(i*24+5,150+(i%3)*10,6,2,"#4d7a3a");
}
function drawHouse(t,doorGlow){
  R(130,88,190,62,"#b79a74"); R(130,88,190,6,"#6b4a2b");
  R(136,110,24,14,"#00000040"); R(250,96,22,18,"#00000030");
  R(132,88,6,62,"#5a3d22"); R(310,88,6,62,"#5a3d22");
  R(122,60,206,30,"#a8552f");
  for(let r=0;r<4;r++)for(let c=0;c<26;c++){R(122+c*8+(r%2)*4,62+r*7,7,5,(c+r)%3?"#8c4426":"#4d6e50")}
  R(122,86,206,4,"#5a2f18");
  for(let i=0;i<30;i++)R(124+i*7,60+(i*13)%26,2,6,"#4a8a3a");
  R(140,100,28,24,"#05080a"); R(139,104,30,4,"#7a5532"); R(139,116,30,4,"#7a5532");
  R(256,100,26,24,"#05080a"); R(255,104,28,4,"#7a5532");
  if(Math.sin(t*2)>-0.4){R(263,110,3,2,"#e8f0a0");R(273,110,3,2,"#e8f0a0")}
  R(286,100,24,24,"#05080a"); R(285,102,26,4,"#7a5532"); R(285,110,26,4,"#7a5532"); R(285,118,26,4,"#7a5532");
  R(190,98,38,52,"#4a2d18"); R(193,101,32,49,"#6b4426");
  R(208,101,2,49,"#1a0e06");
  for(let y=106;y<146;y+=8){R(197,y,9,5,"#8a5a35");R(212,y,9,5,"#8a5a35")}
  R(205,126,2,2,"#e0b050");R(211,126,2,2,"#e0b050");
  if(doorGlow){R(188,96,42,2,"#ffd37a");R(188,96,2,54,"#ffd37a")}
  const fl = 1+Math.sin(t*9)*.15;
  ctx.fillStyle="rgba(255,190,80,.18)";ctx.beginPath();ctx.arc(120,112,24*fl,0,6.3);ctx.fill();
  ctx.fillStyle="rgba(255,190,80,.18)";ctx.beginPath();ctx.arc(120,112,15*fl,0,6.3);ctx.fill();
  R(116,92,2,10,"#555"); R(114,100,10,3,"#7a5532"); R(115,103,8,12,"#c28a2b"); R(118,106,3,6,"#fff2a0");
}
function drawFog(t){
  ctx.fillStyle="rgba(150,200,200,.10)";
  for(let i=0;i<5;i++){const x=((t*6+i*80)%(W+120))-60; ctx.fillRect(x,128+i*5,110,14)}
}

/* ---------- DRAWING: CHARACTERS ---------- */
function drawPlayer(x,y,t,face){
  const bob = Math.round(Math.sin(t*8)*(G.moving?1.5:0.5));
  y+=bob;
  R(x,y+4,14,14,"#1b2a6b");
  R(x+2,y+11,10,6,"#b3264f");
  R(x+1,y,12,8,"#1b2a6b");
  const ex = face>=0 ? x+7 : x+1;
  R(ex,y+1,6,6,"#fff"); R(ex+(face>=0?3:0),y+3,3,3,"#000");
  R(x+1,y+17,5,3,"#1b2a6b"); R(x+8,y+17,5,3,"#1b2a6b");
}

function drawBoss(x,y,b,t,alpha){
  ctx.globalAlpha = alpha===undefined?1:alpha;
  
  if(b.img && IMGS[b.img] && IMGS[b.img].complete && IMGS[b.img].naturalWidth > 0){
    const img = IMGS[b.img];
    const sh = 52;
    const sw = Math.round(sh * (img.naturalWidth / img.naturalHeight));
    const floatY = (G.lvl === 0) ? Math.sin(t*3.4)*3 : 0;
    const sy = 148 - sh + floatY;
    
    // Boss Threat Aura
    const auraCol = (G.lvl === 0) ? "rgba(255, 60, 60, 0.28)" : (G.lvl === 1 ? "rgba(180, 110, 40, 0.28)" : "rgba(30, 30, 30, 0.4)");
    ctx.fillStyle = auraCol;
    ctx.beginPath();
    ctx.arc(x + sw/2, sy + sh/2, 28, 0, 6.3);
    ctx.fill();
    
    // Zap defeat shake & recoil
    const shake = (G.phase === "zap") ? (Math.random() - 0.5) * 6 : 0;
    ctx.drawImage(img, Math.round(x + shake), Math.round(sy), sw, sh);
  } else {
    // Procedural Fallback Sprite
    ctx.fillStyle="rgba(180,255,200,.12)";ctx.beginPath();ctx.arc(x+14,y+20,30,0,6.3);ctx.fill();
    R(x,y+10,28,26,b.col); R(x+4,y,20,14,b.col);
    for(let i=0;i<7;i++) R(x+i*4,y+36+((i+Math.floor(t*6))%2)*3,4,4,b.col);
    R(x+8,y+6,4,4,"#ff3"); R(x+17,y+6,4,4,"#ff3"); R(x+9,y+7,2,2,"#000"); R(x+18,y+7,2,2,"#000");
    if(b.f==="horns"){R(x+3,y-6,4,8,"#eee");R(x+21,y-6,4,8,"#eee")}
    if(b.f==="hair"){R(x-4,y+2,6,36,"#111");R(x+26,y+2,6,36,"#111");R(x+4,y-3,20,4,"#111")}
    if(b.f==="hat"){R(x+1,y-6,26,5,"#c9a96e");R(x+7,y-12,14,7,"#c9a96e")}
    if(b.f==="fangs"){R(x+9,y+11,3,5,"#fff");R(x+17,y+11,3,5,"#fff")}
    R(x+6,y+11,16,2,"#400");
  }
  ctx.globalAlpha=1;
}

function drawHero(x,y,h,t){
  // Hero divine aura
  ctx.fillStyle=h.glow;
  ctx.globalAlpha=.30;
  ctx.beginPath();
  ctx.arc(x+18,y+22,28+Math.sin(t*8)*3,0,6.3);
  ctx.fill();
  ctx.globalAlpha=1;

  if(h.img && IMGS[h.img] && IMGS[h.img].complete && IMGS[h.img].naturalWidth > 0){
    const img = IMGS[h.img];
    const sh = 52;
    const sw = Math.round(sh * (img.naturalWidth / img.naturalHeight));
    const bob = G.phase==="hero" ? Math.sin(t*14)*2 : 0;
    const sy = 148 - sh + bob;
    ctx.drawImage(img, Math.round(x), Math.round(sy), sw, sh);
  } else {
    // Procedural Fallback Sprite
    R(x+3,y,12,11,"#d9a066"); R(x+2,y-2,14,4,"#222");
    R(x,y+11,18,26,h.robe); R(x+7,y+11,4,26,"#00000030");
    R(x+22,y-4,3,42,"#caa56a"); R(x+19,y-9,9,9,h.glow);
  }
}

/* ---------- HUD ---------- */
function drawKeyIcon(x,y){R(x,y,10,10,"#9cc8f0");R(x+3,y+3,4,3,"#123");R(x+4,y+10,3,12,"#9cc8f0");R(x+7,y+14,4,2,"#9cc8f0");R(x+7,y+18,3,2,"#9cc8f0")}
function drawHUD(){
  txt(String(Math.max(0,Math.ceil(G.timer))).padStart(2,"0"),6,28,22,"#fff");
  for(let i=0;i<G.keys;i++) drawKeyIcon(8+i*14,36);
  for(let i=0;i<3;i++) txt("♥",W-18-i*14,16,12,i<G.lives?"#ff4a6e":"#444");
  txt("LVL "+(G.lvl+1)+"/5",W-6,32,7,"#f2b84b","right");
}

/* ---------- SCENES ---------- */
function drawWalk(){
  drawBackground(G.t); drawHouse(G.t,nearDoor()); drawFog(G.t);
  drawPlayer(G.px,130,G.t,1);
  if(nearDoor()) txt("[E] / OPEN",G.px-10,122,7,"#ffd37a");
  txt(theme().name,W/2,172,7,"#cfe",'center');
}

function drawFight(){
  drawBackground(G.t); drawFog(G.t);
  ctx.fillStyle="rgba(120,0,40,"+(0.18*(1-G.timer/BOSS_TIME))+")"; ctx.fillRect(0,0,W,H);
  const boss = theme().bosses[G.door];
  const hero = theme().hero;
  
  // Base boss X position
  const baseX = 70 + 180*Math.max(0,G.timer/BOSS_TIME);
  // When zapped, boss gets defeated and retreats backwards off the screen to the right!
  const retreatX = (G.phase === "zap") ? (G.zapT * 115) : 0;
  const currentBx = baseX + retreatX;
  const alpha = G.phase==="zap" ? Math.max(0,1-G.zapT/2.2) : 1;

  drawPlayer(24,130,G.t,1);
  drawBoss(currentBx, 108 + Math.sin(G.t*3)*3, boss, G.t, alpha);
  if(alpha > 0.2){
    txt(boss.name, currentBx+18, 92, 7, "#ff9db2", 'center');
  }

  if(G.phase==="hero"||G.phase==="zap"){
    drawHero(G.heroX,112,hero,G.t);
    txt(hero.name,G.heroX+18,92,7,hero.glow,'center');

    if(G.phase==="zap"){
      // Screen Flash with hero's glow
      ctx.fillStyle = hero.glow;
      ctx.globalAlpha = Math.max(0,.85-G.zapT*0.6);
      ctx.fillRect(0,0,W,H);
      ctx.globalAlpha = 1;

      // Unique weapon / energy beam per hero!
      if(G.lvl === 0){
        // Sunny: Golden Exorcism Holy Beam
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(G.heroX + 32, 122);
        ctx.lineTo(currentBx + 16, 122);
        ctx.stroke();
        for(let i=0;i<12;i++){ R(currentBx + rnd(-5,35), 118 + rnd(-28,28), 3, 3, (i%2) ? "#ffd700" : "#ff4a6e"); }
      } else if(G.lvl === 1){
        // Thevan: Emerald Paanan Martial Strike Waves
        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(G.heroX + 28, 124, 18 + (G.zapT*50)%40, -1.2, 1.2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(G.heroX + 32, 124);
        ctx.lineTo(currentBx + 16, 124);
        ctx.stroke();
        for(let i=0;i<14;i++){ R(currentBx + rnd(-5,35), 118 + rnd(-28,28), 3, 3, (i%2) ? "#4ade80" : "#fbbf24"); }
      } else if(G.lvl === 2){
        // Arun: Gunshot Muzzle Flash & High-velocity bullet tracer
        // Muzzle flash
        if(G.zapT < 0.4 || (G.zapT > 0.8 && G.zapT < 1.1)){
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(G.heroX + 36, 118, 9, 0, 6.3);
          ctx.fill();
          ctx.fillStyle = "#fbbf24";
          ctx.beginPath();
          ctx.arc(G.heroX + 36, 118, 5, 0, 6.3);
          ctx.fill();
        }
        // Bullet tracer line
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(G.heroX + 36, 118);
        ctx.lineTo(currentBx + 18, 118);
        ctx.stroke();
        for(let i=0;i<16;i++){ R(currentBx + rnd(-8,30), 116 + rnd(-20,20), 2, 2, (i%2) ? "#fbbf24" : "#fff"); }
      } else {
        // Fallback energy
        ctx.strokeStyle = hero.glow;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(G.heroX + 28, 122);
        ctx.lineTo(currentBx + 18, 122);
        ctx.stroke();
      }

      // Shouting speech bubble above Hero
      const shoutText = hero.shout || "BEGONE!";
      const shakeX = (Math.random() - 0.5) * 4;
      const shakeY = (Math.random() - 0.5) * 4;
      const bubbleW = Math.max(76, shoutText.length * 8 + 14);
      const bubbleX = G.heroX + 24 + shakeX;
      const bubbleY = 72 + shakeY;

      ctx.fillStyle = "#fff8db";
      ctx.strokeStyle = "#b3264f";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.rect(bubbleX - bubbleW/2, bubbleY - 14, bubbleW, 20);
      ctx.fill();
      ctx.stroke();

      // Bubble pointer down to hero
      ctx.beginPath();
      ctx.moveTo(bubbleX - 6, bubbleY + 6);
      ctx.lineTo(bubbleX, bubbleY + 14);
      ctx.lineTo(bubbleX + 6, bubbleY + 6);
      ctx.fillStyle = "#fff8db";
      ctx.fill();
      ctx.stroke();

      // Bold shouting text
      ctx.font = "bold 8px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "#b3264f";
      ctx.fillText(shoutText, bubbleX, bubbleY);
    }
  }
}

function drawTitle(){
  drawBackground(G.t); drawHouse(G.t,false); drawFog(G.t); drawPlayer(60,130,G.t,1);
}

/* ---------- LOOP ---------- */
const nearDoor = ()=>Math.abs((G.px+7)-209)<24;
function update(dt){
  G.t+=dt; G.moving=false;
  if(G.state==="walk"&&!panelOpen()){
    const d=(keys.right?1:0)-(keys.left?1:0);
    if(d){G.px=Math.max(6,Math.min(196,G.px+d*70*dt));G.moving=true}
  }
  if(G.state==="fight"){
    if(G.phase==="wait"){ G.timer-=dt; if(G.timer<=0) caught(); }
    else if(G.phase==="hero"){
      G.heroX+=140*dt;
      const bx=70+180*Math.max(0,G.timer/BOSS_TIME);
      if(G.heroX>=bx-34){
        G.phase="zap";
        G.zapT=0;
        playDefeatAudio(G.lvl);
      }
    }
    else if(G.phase==="zap"){
      G.zapT+=dt;
      const zapLimit = (G.lvl === 1 ? 2.5 : (G.lvl === 2 ? 2.0 : 1.9));
      if(G.zapT > zapLimit) bossDown();
    }
  }
}
function draw(){
  if(G.state==="title") drawTitle();
  else if(G.state==="walk"){drawWalk();drawHUD()}
  else if(G.state==="fight"){drawFight();drawHUD()}
  else if(G.state==="over") {drawTitle()}
}
function loop(ts){const dt=Math.min((ts-lastTs)/1000||0,.05);lastTs=ts;update(dt);draw();requestAnimationFrame(loop)}

/* ---------- FLOW ---------- */
function showTitle(){
  G.state="title";
  showPanel(`<h1>KAAVU<br>HALLOWEEN NIGHT</h1>
    <div>5 haunted levels. Iconic battles.<br>
    L1: <span style="color:#ffd700">Sunny</span> vs <span style="color:#ff8fa8">Nagavalli</span><br>
    L2: <span style="color:#4ade80">Thevan</span> vs <span style="color:#fbbf24">Koduman Potti</span><br>
    L3: <span style="color:#60a5fa">Arun</span> vs <span style="color:#e5e7eb">Christopher</span></div>
    <div class="row"><button id="go">START GAME</button></div>
    <div style="color:#8fb">← → move · E / Enter = open door</div>`);
  document.getElementById("go").onclick=()=>{
    initAudio();
    G.lvl=0;G.lives=3;G.keys=0;
    startLevel();
  };
}

function startLevel(){
  G.state="walk";G.px=20;G.timer=BOSS_TIME;helpBtn.style.display="none";
  const L=theme();
  const boss = L.bosses[0];
  const preview = (L.hero.img && boss.img) ? `
    <div style="display:flex;justify-content:center;gap:18px;align-items:center;margin:6px 0">
      <div style="text-align:center">
        <img src="assets/${L.hero.img}.png" style="height:56px;image-rendering:pixelated;filter:drop-shadow(0 0 6px ${L.hero.glow})">
        <div style="font-size:8px;color:${L.hero.glow};margin-top:3px">${L.hero.name}</div>
      </div>
      <div style="font-size:11px;color:#ff8fa8">VS</div>
      <div style="text-align:center">
        <img src="assets/${boss.img}.png" style="height:56px;image-rendering:pixelated;filter:drop-shadow(0 0 6px #f44)">
        <div style="font-size:8px;color:#ff8fa8;margin-top:3px">${boss.name}</div>
      </div>
    </div>` : ``;

  showPanel(`<h2>LEVEL ${G.lvl+1}</h2><h1 style="font-size:clamp(12px,2.6vw,22px)">${L.name}</h1>
    ${preview}
    <div>Your ally this level:<br><span style="color:${L.hero.glow}">${L.hero.name}</span></div>
    <div class="row"><button id="go">ENTER THE HOUSE</button></div>`);
  document.getElementById("go").onclick=()=>{
    initAudio();
    closePanel();
  };
}

function showDoors(){
  // Randomize Door 1, Door 2, and Door 3 puzzle types initially upon opening
  G.doorPuzzles = shuffle(ALL_PUZZLE_TYPES);

  showPanel(`<h2>CHOOSE A DOOR</h2><div>Each door holds a random challenge...</div>
    <div class="row">${[0,1,2].map(i=>`
      <button class="door" data-i="${i}">
        🚪<br>DOOR ${i+1}
        <small>${PUZZLE_META[G.doorPuzzles[i]].icon} ${PUZZLE_META[G.doorPuzzles[i]].name}</small>
      </button>`).join("")}
    </div>`);
  panel.querySelectorAll(".door").forEach(b=>b.onclick=()=>enterDoor(+b.dataset.i));
}

function enterDoor(i){
  G.door=i;
  // Use randomized puzzle for this specific door
  G.currentPuzzle = G.doorPuzzles ? G.doorPuzzles[i] : ALL_PUZZLE_TYPES[i];
  G.state="fight";G.phase="wait";G.timer=BOSS_TIME;G.heroX=-30;
  const boss=theme().bosses[i];
  const bossImg = boss.img ? `<div style="margin:4px 0"><img src="assets/${boss.img}.png" style="height:56px;image-rendering:pixelated;filter:drop-shadow(0 0 8px #f33)"></div>` : ``;

  showPanel(`<h2>${boss.name.toUpperCase()} APPEARS!</h2>
    ${bossImg}
    <div>It is closing in... you have ${BOSS_TIME} seconds.<br>Press CALL FOR HELP and solve the puzzle<br>to summon <span style="color:${theme().hero.glow}">${theme().hero.name}</span>.</div>
    <div class="row"><button id="go">FACE IT</button></div>`);
  document.getElementById("go").onclick=()=>{closePanel();helpBtn.style.display="block"};
}

function caught(){
  G.lives--;helpBtn.style.display="none";
  if(G.lives<=0){ G.state="over";
    showPanel(`<h1>YOU WERE CAUGHT</h1><div>${theme().name} claims another soul...</div><div class="row"><button class="alt" id="go">TRY AGAIN</button></div>`);
    document.getElementById("go").onclick=showTitle; return; }
  G.state="walk";G.px=20;
  showPanel(`<h2>CAUGHT!</h2><div>Lives left: ${"♥".repeat(G.lives)}</div><div class="row"><button id="go">BACK TO THE DOORS</button></div>`);
  document.getElementById("go").onclick=()=>{closePanel();G.px=190;showDoors()};
}

function bossDown(){
  const defeatedBoss = theme().bosses[G.door].name;
  G.keys++;G.lvl++;G.state="walk";G.phase="wait";helpBtn.style.display="none";
  if(G.lvl>=LEVELS.length){
    showPanel(`<h1>YOU WIN!</h1><div>All spirits and villains banished.<br>Dawn breaks over the kaavu. Happy Halloween!</div><div class="row"><button id="go">PLAY AGAIN</button></div>`);
    document.getElementById("go").onclick=showTitle; return; }
  showPanel(`<h2>${defeatedBoss.toUpperCase()} DEFEATED!</h2><div>Key collected (${G.keys} / 5 keys)</div><div class="row"><button id="go">NEXT LEVEL</button></div>`);
  document.getElementById("go").onclick=startLevel;
}

/* ---------- PUZZLES (help = solve to summon hero) ---------- */
helpBtn.onclick=()=>{ if(G.state!=="fight"||G.phase!=="wait")return; openPuzzle() };
function solved(){ closePanel(); helpBtn.style.display="none"; G.phase="hero"; G.heroX=-30 }
function wrong(){ G.timer=Math.max(1,G.timer-4); const m=document.getElementById("msg"); if(m)m.textContent="WRONG! -4 seconds" }

function openPuzzle(){
  const type = G.currentPuzzle || (G.doorPuzzles && G.doorPuzzles[G.door]) || ALL_PUZZLE_TYPES[G.door];
  showPanel(`<h2>SOLVE TO SUMMON ${theme().hero.name.toUpperCase()}</h2><div id="q"></div><div class="row" id="opts"></div><div id="msg"></div>
    <div class="row"><button id="close" class="alt">BACK</button></div>`);
  document.getElementById("close").onclick=closePanel;
  if(type==="math") mathPuzzle(); else if(type==="memory") memoryPuzzle(); else riddlePuzzle();
}

function optionsUI(list,correctIdx){
  const o=document.getElementById("opts");
  list.forEach((label,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=label;b.onclick=()=>i===correctIdx?solved():wrong();o.appendChild(b)});
}
function mathPuzzle(){
  const L=G.lvl, a=rnd(2,8+L), b=rnd(2,6+L), c=rnd(2,5), ans=a+b*c;
  document.getElementById("q").textContent=`${a} + ${b} × ${c} = ?`;
  const set=new Set([ans]); while(set.size<4) set.add(ans+rnd(-9,9));
  const opts=shuffle([...set]); optionsUI(opts.map(String),opts.indexOf(ans));
}
function riddlePuzzle(){
  const [q,opts,ci]=TRIVIA[rnd(0,TRIVIA.length-1)];
  const pairs=shuffle(opts.map((t,i)=>({t,ok:i===ci})));
  document.getElementById("q").textContent=q;
  optionsUI(pairs.map(p=>p.t),pairs.findIndex(p=>p.ok));
}
function memoryPuzzle(){
  const cols=["#ff5555","#55ee55","#5599ff","#ffdd44"], len=3+Math.min(G.lvl,3);
  const seq=Array.from({length:len},()=>rnd(0,3)); let pos=0, ok=false;
  document.getElementById("q").textContent="Watch the lamps, then repeat the order.";
  const o=document.getElementById("opts");
  const lamps=cols.map((c,i)=>{const b=document.createElement("button");b.className="lamp";b.style.background=c;b.style.color=c;o.appendChild(b);return b});
  const flash=i=>{lamps[i].classList.add("on");setTimeout(()=>lamps[i].classList.remove("on"),350)};
  const play=()=>{ok=false;let i=0;const iv=setInterval(()=>{ if(!panelOpen()){clearInterval(iv);return} if(i>=len){clearInterval(iv);ok=true;return} flash(seq[i++]) },650)};
  lamps.forEach((b,i)=>b.onclick=()=>{ if(!ok)return; flash(i);
    if(i===seq[pos]){pos++; if(pos===len) setTimeout(solved,300)} else {wrong();pos=0;ok=false;setTimeout(play,900)} });
  setTimeout(play,600);
}

/* ---------- INPUT ---------- */
function action(){ if(G.state==="walk"&&!panelOpen()&&nearDoor()) showDoors(); }
addEventListener("keydown",e=>{
  initAudio();
  if(["ArrowLeft","a","A"].includes(e.key))keys.left=true;
  if(["ArrowRight","d","D"].includes(e.key))keys.right=true;
  if(["e","E","Enter"," "].includes(e.key)){ if(!panelOpen()) {action(); e.preventDefault()} }
});
addEventListener("keyup",e=>{
  if(["ArrowLeft","a","A"].includes(e.key))keys.left=false;
  if(["ArrowRight","d","D"].includes(e.key))keys.right=false;
});
const hold=(id,k)=>{const b=document.getElementById(id);["pointerdown"].forEach(ev=>b.addEventListener(ev,e=>{initAudio();e.preventDefault();keys[k]=true}));["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))};
hold("bL","left");hold("bR","right");
document.getElementById("bA").addEventListener("pointerdown",e=>{initAudio();e.preventDefault();action()});

document.addEventListener("click", ()=>initAudio(), {once:true});

showTitle(); requestAnimationFrame(loop);
</script>
</body>
</html>
